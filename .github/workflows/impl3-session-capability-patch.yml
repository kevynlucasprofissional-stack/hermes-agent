name: Impl3 session capability patch

on:
  push:
    branches:
      - validation/impl3-browser-session-capability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/impl3-browser-session-capability
          fetch-depth: 0
      - name: Apply patch
        run: python .github/impl3_patch.py
      - name: Commit candidate
        shell: bash
        run: |
          git rm .github/impl3_patch.py .github/workflows/impl3-session-capability-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/registry.py tools/browser_workstation.py model_tools.py tests/tui_gateway/test_workstation_browser_schema_capability.py
          git commit -m "feat(workstation): make browser schema a desktop session capability"
          git push origin HEAD:validation/impl3-browser-session-capability
