name: Impl3 session capability patch

on:
  push:
    branches:
      - validation/impl3-browser-session-capability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply patch through GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import json
          import os
          import urllib.request

          url = "https://api.github.com/repos/kevynlucasprofissional-stack/hermes-agent/contents/.github/impl3_patch.py?ref=validation/impl3-browser-session-capability"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "hermes-workstation-impl3-bootstrap",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
          code = base64.b64decode(payload["content"]).decode("utf-8")
          exec(compile(code, ".github/impl3_patch.py", "exec"), {"__name__": "__main__"})
