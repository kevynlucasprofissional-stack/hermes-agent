name: Workstation Browser Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/electron/workstation-browser-runtime.ts"
      - "apps/desktop/src/app/browser/**"
      - "workstation/**"
      - "tools/browser_workstation.py"
      - "tools/browser_tool.py"
      - "apps/desktop/electron/main.ts"
      - "apps/desktop/electron/preload.ts"
      - "apps/desktop/src/global.d.ts"
      - "apps/desktop/src/app/routes.ts"
      - "apps/desktop/src/app/chat/sidebar/index.tsx"
      - "apps/desktop/src/app/contrib/surfaces.tsx"
      - "apps/desktop/src/plugins/kanban/plugin.tsx"
      - "apps/desktop/package.json"
      - "package-lock.json"
      - ".github/workflows/workstation-browser-windows.yml"

jobs:
  desktop-typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate committed Workstation integration
        run: python workstation/scripts/apply_core_integration.py --root . --check
      - name: Install Workstation from committed source
        shell: cmd
        run: workstation\install.cmd
      - name: Assert install kept checkout clean
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count -ne 0) {
            $dirty | Write-Host
            throw "Workstation install changed the committed checkout."
          }
      - name: Desktop typecheck
        run: npm run typecheck --workspace apps/desktop
      - name: Desktop UI tests
        run: npm run test:ui --workspace apps/desktop
      - name: Browser runtime Electron tests
        run: npm run test:desktop:platforms --workspace apps/desktop
