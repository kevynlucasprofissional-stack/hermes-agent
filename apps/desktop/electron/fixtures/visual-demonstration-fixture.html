<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hermes Work — Learning Mode Visual Demonstration Fixture</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f1117;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 1280px;
      height: 720px;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3142;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .status-badge {
      padding: 4px 12px;
      border-radius: 9999px;
      background: #2563eb;
      font-size: 13px;
      font-weight: 500;
    }
    main {
      flex: 1;
      display: flex;
      padding: 24px;
      gap: 24px;
    }
    .canvas-container {
      flex: 2;
      background: #141721;
      border: 1px solid #2d3142;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      width: 800px;
      height: 450px;
      background: #000;
      border-radius: 4px;
    }
    .controls-panel {
      flex: 1;
      background: #1a1d27;
      border: 1px solid #2d3142;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    button {
      padding: 10px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }
    button:hover {
      background: #2563eb;
    }
    .metrics {
      font-family: monospace;
      font-size: 14px;
      background: #0f1117;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #2d3142;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Hermes Learning Mode — Native Demonstration Fixture</h1>
    <span class="status-badge" id="phase-badge">Phase: Initializing</span>
  </header>
  <main>
    <div class="canvas-container">
      <canvas id="stage" width="800" height="450"></canvas>
    </div>
    <div class="controls-panel">
      <h3>Operator Actions</h3>
      <button id="btn-color" role="button" aria-label="Cycle Palette">🎨 Cycle Color Palette</button>
      <button id="btn-shape" role="button" aria-label="Toggle Geometry">📐 Toggle Geometric Complexity</button>
      <button id="btn-save" role="button" aria-label="Commit Checkpoint">💾 Commit Visual Checkpoint</button>
      <div class="metrics">
        <div>Elapsed: <span id="metric-elapsed">0.00s</span></div>
        <div>Frame: <span id="metric-frame">0</span></div>
        <div>Hue Angle: <span id="metric-hue">0°</span></div>
        <div>Coordinates: <span id="metric-coords">X: 0, Y: 0</span></div>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const metricElapsed = document.getElementById('metric-elapsed');
    const metricFrame = document.getElementById('metric-frame');
    const metricHue = document.getElementById('metric-hue');
    const metricCoords = document.getElementById('metric-coords');
    const phaseBadge = document.getElementById('phase-badge');

    let frameCount = 0;
    const startTime = performance.now();
    let shapeMode = 0;
    let customHueOffset = 0;

    document.getElementById('btn-color').addEventListener('click', () => {
      customHueOffset = (customHueOffset + 45) % 360;
    });

    document.getElementById('btn-shape').addEventListener('click', () => {
      shapeMode = (shapeMode + 1) % 3;
    });

    document.getElementById('btn-save').addEventListener('click', () => {
      phaseBadge.innerText = 'Phase: Checkpoint Saved';
    });

    function render() {
      const now = performance.now();
      const elapsedSec = (now - startTime) / 1000;
      frameCount++;

      const baseHue = Math.floor((elapsedSec * 30 + customHueOffset) % 360);
      const posX = 400 + Math.sin(elapsedSec * 2) * 280;
      const posY = 225 + Math.cos(elapsedSec * 3) * 140;

      // Update Phase Badge based on elapsed time (changing over 30+ seconds)
      if (elapsedSec < 10) {
        phaseBadge.innerText = 'Phase 1: Component Calibration (' + Math.floor(elapsedSec) + 's)';
        phaseBadge.style.background = '#2563eb';
      } else if (elapsedSec < 20) {
        phaseBadge.innerText = 'Phase 2: Complex Transformation (' + Math.floor(elapsedSec) + 's)';
        phaseBadge.style.background = '#7c3aed';
      } else if (elapsedSec < 30) {
        phaseBadge.innerText = 'Phase 3: High Precision Alignment (' + Math.floor(elapsedSec) + 's)';
        phaseBadge.style.background = '#059669';
      } else {
        phaseBadge.innerText = 'Phase 4: Synthesis & Validation (' + Math.floor(elapsedSec) + 's)';
        phaseBadge.style.background = '#d97706';
      }

      // Clear background with subtle dynamic gradient
      const grad = ctx.createLinearGradient(0, 0, 800, 450);
      grad.addColorStop(0, `hsl(${baseHue}, 50%, 15%)`);
      grad.addColorStop(1, `hsl(${(baseHue + 60) % 360}, 60%, 8%)`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 800, 450);

      // Render concentric rotating rings
      for (let r = 50; r <= 180; r += 30) {
        ctx.beginPath();
        ctx.arc(400, 225, r, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${(baseHue + r) % 360}, 70%, 60%, 0.4)`;
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // Render bouncing dynamic shape
      ctx.save();
      ctx.translate(posX, posY);
      ctx.rotate(elapsedSec * 4);

      if (shapeMode === 0) {
        ctx.fillStyle = `hsl(${(baseHue + 180) % 360}, 90%, 65%)`;
        ctx.fillRect(-35, -35, 70, 70);
      } else if (shapeMode === 1) {
        ctx.beginPath();
        ctx.arc(0, 0, 40, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${(baseHue + 120) % 360}, 95%, 60%)`;
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(0, -45);
        ctx.lineTo(40, 35);
        ctx.lineTo(-40, 35);
        ctx.closePath();
        ctx.fillStyle = `hsl(${(baseHue + 240) % 360}, 95%, 65%)`;
        ctx.fill();
      }
      ctx.restore();

      // Render high-contrast visual timestamp overlay on canvas
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px monospace';
      ctx.fillText(`HERMES DEMO | T: ${elapsedSec.toFixed(2)}s | F: ${frameCount}`, 30, 50);

      ctx.fillStyle = `hsl(${baseHue}, 100%, 75%)`;
      ctx.font = '16px monospace';
      ctx.fillText(`Target: (${posX.toFixed(1)}, ${posY.toFixed(1)}) | Shape: ${shapeMode}`, 30, 80);

      // Update DOM Metrics
      metricElapsed.innerText = elapsedSec.toFixed(2) + 's';
      metricFrame.innerText = frameCount;
      metricHue.innerText = baseHue + '°';
      metricCoords.innerText = `X: ${posX.toFixed(0)}, Y: ${posY.toFixed(0)}`;

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
